name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Version
        run: swift --version

      - name: Build
        run: swift build

      - name: Core-Pruefungen (ohne Xcode)
        run: swift run CoreChecks

      - name: XCTest
        run: swift test
